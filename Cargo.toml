[package]
name = "superpatch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.35.0"
egui_extras = { version = "0.35.0", features = ["all_loaders"] }
image = { version = "0.25.10", features = ["jpeg", "png"] }
native-dialog = "0.9.7"
open = "5.3.6"
ordered_hash_map = "0.6.0"
rayon = "1.12.0"
regex = "1.13.0"
serde = "1.0.228"
serde_json = "1.0.150"
sysinfo = "0.39.6"
unarc-rs = "0.6.1"
walkdir = "2.5.0"
xmloxide = "0.4.4"
zesven = { version = "1.2.0", default-features = true, features=["fast-lzma2", "sysinfo"] }

[profile.release]
strip = true
lto = true
